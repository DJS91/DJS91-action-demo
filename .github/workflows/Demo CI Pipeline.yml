name: Demo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: {}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run local action
        id: random
        uses: ./
        with:
          user-name: GitHub Actions

      - name: Verify generated number
        env:
          GENERATED_NUMBER: ${{ steps.random.outputs.generated-number }}
        run: |
          if [[ ! "$GENERATED_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::The action did not return a valid number."
            exit 1
          fi
          echo "The action returned: $GENERATED_NUMBER"
